; Department branding for the Dispatch Console.
; Edit this file, then run Build_And_Run.cmd again (it copies this folder into build\branding).
; You can also edit build\branding\brand.ini directly and just restart the console - no rebuild needed.
; Blank or missing lines use the defaults shown.

; Shown in the header, splash screen and About box.
Department=DISPATCH CENTER
; Short name (a few letters).
ShortName=DISPATCH
; Window title and menu name.
Product=Dispatch Console
; Optional line under the department name, e.g. SERVICE - DEDICATION - PROTECTION
Motto=
; Optional, e.g. EST. 1952
Established=

; Image files in this folder. A square PNG (512x512 or larger, transparent background) works best.
; The .exe's own icon comes from app.ico at build time; replace app.ico before building to change it.
Logo=logo.png
Icon=app.ico

; Folder under C:\ProgramData for settings and recordings. Change it only before first use
; (or move the existing folder yourself), otherwise the console starts with fresh settings.
DataFolder=Dispatch Console
